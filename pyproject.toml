[project]
name = "mush-integrity-tests"
version = "0.1.0"
description = "Test suite for bash scripts and system tools"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-xdist",  # parallel test execution
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
